<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D1B2A">
<title>Team Wellness</title>
<link rel="manifest" href="manifest.json">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

  :root {
    --bg: #0D1B2A;
    --surface: #162032;
    --surface2: #1E2D42;
    --border: rgba(255,255,255,0.08);
    --text: #F0F4F8;
    --muted: #7A8FA6;
    --accent: #3B82F6;
    --accent-dim: rgba(59,130,246,0.15);
    --green: #22C55E;
    --green-dim: rgba(34,197,94,0.15);
    --amber: #F59E0B;
    --amber-dim: rgba(245,158,11,0.15);
    --red: #EF4444;
    --red-dim: rgba(239,68,68,0.15);
    --radius: 14px;
    --radius-sm: 9px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overscroll-behavior: none;
  }

  /* ── ÉCRAN SÉLECTION JOUEUR ── */
  .screen { display: none; min-height: 100vh; }
  .screen.active { display: block; }

  .top-bar {
    padding: 56px 20px 20px;
    background: linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%);
  }
  .top-bar h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }
  .top-bar p  { font-size: 14px; color: var(--muted); margin-top: 4px; }

  .badge-pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500;
    margin-bottom: 10px;
  }
  .badge-matin   { background: rgba(59,130,246,0.18); color: #60A5FA; }
  .badge-seance  { background: rgba(239,68,68,0.18);  color: #F87171; }
  .badge-dot { width:6px; height:6px; border-radius:50%; }
  .badge-matin .badge-dot   { background: #60A5FA; }
  .badge-seance .badge-dot  { background: #F87171; }

  .player-grid {
    padding: 0 16px 100px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .player-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
    cursor: pointer; transition: background .15s, transform .1s;
    text-decoration: none; color: inherit;
  }
  .player-card:active { background: var(--surface2); transform: scale(0.98); }
  .player-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--accent-dim);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; color: var(--accent);
    flex-shrink: 0;
  }
  .player-info { flex: 1; }
  .player-info strong { font-size: 14px; font-weight: 500; display: block; }
  .player-info span   { font-size: 12px; color: var(--muted); }
  .player-status {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--border);
  }
  .player-status.done { background: var(--green); }

  .mode-toggle {
    display: flex; gap: 8px; padding: 16px 16px 0;
  }
  .mode-btn {
    flex: 1; padding: 10px 8px; border-radius: var(--radius-sm);
    border: 0.5px solid var(--border);
    background: var(--surface); color: var(--muted);
    font-size: 13px; font-weight: 500; cursor: pointer;
    transition: all .15s; font-family: inherit;
  }
  .mode-btn.active-matin   { background: var(--accent-dim); color: #60A5FA; border-color: rgba(59,130,246,0.4); }
  .mode-btn.active-seance  { background: var(--red-dim);    color: #F87171; border-color: rgba(239,68,68,0.4); }

  /* ── FORMULAIRE ── */
  .form-header {
    padding: 52px 20px 16px;
    background: var(--surface);
    border-bottom: 0.5px solid var(--border);
  }
  .back-btn {
    display: flex; align-items: center; gap: 6px;
    color: var(--muted); font-size: 14px; cursor: pointer;
    background: none; border: none; font-family: inherit; margin-bottom: 16px; padding: 0;
  }
  .back-btn svg { width:16px; height:16px; }
  .form-player { display: flex; align-items: center; gap: 12px; }
  .form-avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--accent-dim);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; color: var(--accent);
  }
  .form-name { font-size: 17px; font-weight: 600; }
  .form-date { font-size: 13px; color: var(--muted); margin-top: 2px; }

  .form-body { padding: 0 0 120px; }

  .section-sep {
    padding: 20px 20px 8px;
    font-size: 11px; font-weight: 600; letter-spacing: .08em;
    color: var(--muted); text-transform: uppercase;
  }

  /* Score bar */
  .score-wrap {
    margin: 12px 16px 0;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .score-row { display: flex; align-items: center; gap: 10px; }
  .score-label { font-size: 13px; color: var(--muted); flex-shrink: 0; }
  .score-track {
    flex: 1; height: 8px; border-radius: 4px;
    background: var(--surface2);
    overflow: hidden;
  }
  .score-fill {
    height: 100%; border-radius: 4px;
    transition: width .4s cubic-bezier(.4,0,.2,1), background .3s;
    width: 0%;
  }
  .score-num {
    font-size: 15px; font-weight: 600; min-width: 44px; text-align: right;
  }

  /* Items wellness */
  .item-list { display: flex; flex-direction: column; gap: 8px; padding: 0 16px; }
  .item-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    transition: border-color .2s;
  }
  .item-card.filled { border-color: rgba(255,255,255,0.15); }
  .item-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .item-emoji { font-size: 20px; width: 28px; text-align: center; }
  .item-name { font-size: 14px; font-weight: 500; flex: 1; }
  .item-val {
    font-size: 18px; font-weight: 600;
    min-width: 20px; text-align: center; transition: color .2s;
    color: var(--muted);
  }
  .btns { display: flex; gap: 6px; }
  .w-btn {
    flex: 1; height: 38px; border-radius: var(--radius-sm);
    border: 0.5px solid var(--border);
    background: var(--surface2);
    font-size: 14px; font-weight: 500; cursor: pointer;
    color: var(--muted); font-family: inherit;
    transition: all .12s;
  }
  .w-btn:active { transform: scale(0.93); }
  .w-btn.sel-1, .w-btn.sel-2 { background: var(--red-dim);   color: var(--red);   border-color: rgba(239,68,68,0.4); }
  .w-btn.sel-3               { background: var(--amber-dim); color: var(--amber); border-color: rgba(245,158,11,0.4); }
  .w-btn.sel-4, .w-btn.sel-5 { background: var(--green-dim); color: var(--green); border-color: rgba(34,197,94,0.4); }

  /* RPE */
  .rpe-wrap { padding: 0 16px; }
  .rpe-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }
  .rpe-big {
    font-size: 56px; font-weight: 700; text-align: center;
    padding: 8px 0; color: var(--muted);
    transition: color .2s, transform .15s;
    letter-spacing: -2px;
  }
  .rpe-big.pop { transform: scale(1.1); }
  .rpe-desc { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 16px; min-height: 18px; }
  .rpe-row { display: flex; gap: 5px; margin-bottom: 5px; }
  .rpe-btn {
    flex: 1; height: 42px; border-radius: var(--radius-sm);
    border: 0.5px solid var(--border);
    background: var(--surface2);
    font-size: 15px; font-weight: 500; cursor: pointer;
    color: var(--muted); font-family: inherit;
    transition: all .12s;
  }
  .rpe-btn:active { transform: scale(0.9); }
  .rpe-btn.rsel { font-weight: 600; }
  .rpe-btn.rsel.low  { background:var(--green-dim); color:var(--green); border-color:rgba(34,197,94,.4); }
  .rpe-btn.rsel.mid  { background:var(--amber-dim); color:var(--amber); border-color:rgba(245,158,11,.4); }
  .rpe-btn.rsel.high { background:var(--red-dim);   color:var(--red);   border-color:rgba(239,68,68,.4); }

  /* Durée slider */
  .slider-wrap {
    margin: 0 16px;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .slider-row { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .slider-label { font-size: 14px; font-weight: 500; margin-bottom: 2px; color: var(--text); }
  input[type=range] {
    flex: 1; height: 4px; -webkit-appearance: none;
    background: var(--surface2); border-radius: 2px; outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent); cursor: pointer;
    box-shadow: 0 0 0 4px rgba(59,130,246,.2);
  }
  .slider-val { font-size: 15px; font-weight: 600; min-width: 52px; text-align: right; color: var(--accent); }

  /* sRPE */
  .srpe-display {
    margin: 0 16px;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .srpe-label { font-size: 14px; color: var(--muted); }
  .srpe-val { font-size: 22px; font-weight: 700; color: var(--muted); transition: color .3s; }

  /* Note */
  .note-wrap {
    margin: 0 16px;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .note-hint { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  textarea {
    width: 100%; background: transparent; border: none; outline: none;
    font-family: inherit; font-size: 14px; color: var(--text);
    resize: none; line-height: 1.5;
  }
  textarea::placeholder { color: var(--muted); }

  /* Submit */
  .submit-wrap { position: fixed; bottom: 0; left: 0; right: 0; padding: 16px 16px 32px; background: linear-gradient(0deg, var(--bg) 70%, transparent); }
  .submit-btn {
    width: 100%; height: 52px; border: none; border-radius: var(--radius);
    font-size: 16px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: all .15s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .submit-btn-matin  { background: var(--accent); color: #fff; }
  .submit-btn-seance { background: var(--red);    color: #fff; }
  .submit-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .submit-btn:not(:disabled):active { transform: scale(0.97); }

  /* Succès */
  .success-screen {
    display: none; min-height: 100vh;
    flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 24px; text-align: center;
    background: var(--bg);
  }
  .success-screen.active { display: flex; }
  .success-icon-wrap {
    width: 72px; height: 72px; border-radius: 50%; margin-bottom: 20px;
    display: flex; align-items: center; justify-content: center; font-size: 32px;
  }
  .success-matin  .success-icon-wrap { background: var(--green-dim); }
  .success-seance .success-icon-wrap { background: var(--red-dim); }
  .success-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .success-sub   { font-size: 15px; color: var(--muted); margin-bottom: 28px; }
  .success-stats {
    display: flex; gap: 16px; width: 100%; max-width: 320px;
    background: var(--surface); border: 0.5px solid var(--border);
    border-radius: var(--radius); padding: 16px;
    justify-content: space-around;
  }
  .stat { text-align: center; }
  .stat-val { font-size: 24px; font-weight: 700; }
  .stat-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .status-badge {
    display: inline-block; padding: 3px 10px; border-radius: 20px;
    font-size: 12px; font-weight: 600; margin-top: 4px;
  }
</style>
</head>
<body>

<!-- ═══ ÉCRAN 1 : SÉLECTION JOUEUR ═══ -->
<div class="screen active" id="screen-select">
  <div class="top-bar">
    <div id="badge-top" class="badge-pill badge-matin">
      <span class="badge-dot"></span>
      <span id="badge-label">Wellness matin</span>
    </div>
    <h1 id="select-title">Bonjour 👋</h1>
    <p id="select-sub">Qui es-tu ?</p>
  </div>

  <div class="mode-toggle">
    <button class="mode-btn active-matin" id="btn-mode-matin" onclick="setMode('matin')">☀️ Wellness matin</button>
    <button class="mode-btn" id="btn-mode-seance" onclick="setMode('seance')">🔥 RPE post-séance</button>
  </div>

  <div class="player-grid" id="player-grid"></div>
</div>

<!-- ═══ ÉCRAN 2 : FORMULAIRE ═══ -->
<div class="screen" id="screen-form">
  <div class="form-header">
    <button class="back-btn" onclick="goBack()">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3L5 8l5 5"/></svg>
      Retour
    </button>
    <div class="form-player">
      <div class="form-avatar" id="form-avatar">XX</div>
      <div>
        <div class="form-name" id="form-name">—</div>
        <div class="form-date" id="form-date">—</div>
      </div>
    </div>
  </div>

  <div class="form-body" id="form-body"></div>

  <div class="submit-wrap">
    <button class="submit-btn" id="submit-btn" disabled onclick="handleSubmit()">
      Envoyer au staff
    </button>
  </div>
</div>

<!-- ═══ ÉCRAN 3 : SUCCÈS ═══ -->
<div class="success-screen" id="screen-success">
  <div class="success-icon-wrap" id="ok-icon">✅</div>
  <div class="success-title" id="ok-title">Envoyé !</div>
  <div class="success-sub"  id="ok-sub">Le staff a reçu tes données</div>
  <div class="success-stats" id="ok-stats"></div>
  <button onclick="goHome()" style="margin-top:24px;background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;font-family:inherit;">← Retour à l'accueil</button>
</div>

<script>
// ── CONFIG ── Remplace par ton URL Google Apps Script après déploiement
const APPS_SCRIPT_URL = "COLLE_TON_URL_ICI";

const JOUEURS = [
  "Benjamin Sene","Zakai Zeigler","Jeremy Senglin",
  "Hugo Yimga-Moukouri","Paul Lacombe","Lucas Dussoulier",
  "Roko Prkacin","Donta Scott","Mathis Dossou-Yovo",
  "Mitchell Saxen","Len Shoorman","Alexandre Chassange"
];

const ITEMS_W = [
  {key:"humeur",  label:"Humeur",             emoji:"😊"},
  {key:"energie", label:"Énergie",             emoji:"⚡"},
  {key:"douleur", label:"Douleur musculaire",  emoji:"💪"},
  {key:"alim",    label:"Alim. / Hydratation", emoji:"💧"},
  {key:"stress",  label:"Stress",              emoji:"🧠"},
  {key:"sommeil", label:"Sommeil",             emoji:"🌙"},
];

const RPE_DESC = ["Repos complet","Très très léger","Très léger","Léger","Modéré","Difficile","Difficile +","Très difficile","Très difficile +","Maximal"];

let mode = "matin";
let currentPlayer = null;
let wVals = {};
let rpeVal = null;
let dureeVal = 75;

// ── Date
const NOW = new Date();
const JOURS = ["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
const MOIS  = ["jan","fév","mar","avr","mai","jun","jul","aoû","sep","oct","nov","déc"];
const DATE_STR = JOURS[NOW.getDay()]+" "+NOW.getDate()+" "+MOIS[NOW.getMonth()]+" "+NOW.getFullYear();

// ── Initiales
function initials(name) {
  return name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
}

// ── Build player grid
function buildGrid() {
  const grid = document.getElementById("player-grid");
  grid.innerHTML = "";
  JOUEURS.forEach(j => {
    const key = "done_"+mode+"_"+j+"_"+NOW.toDateString();
    const done = localStorage.getItem(key);
    const card = document.createElement("div");
    card.className = "player-card";
    card.onclick = () => openForm(j);
    card.innerHTML = `
      <div class="player-avatar">${initials(j)}</div>
      <div class="player-info">
        <strong>${j}</strong>
        <span>${done ? (mode==="matin"?"Wellness envoyé ✓":"RPE envoyé ✓") : "En attente"}</span>
      </div>
      <div class="player-status ${done?"done":""}"></div>`;
    grid.appendChild(card);
  });
}

// ── Mode toggle
function setMode(m) {
  mode = m;
  const bm = document.getElementById("btn-mode-matin");
  const bs = document.getElementById("btn-mode-seance");
  const badge = document.getElementById("badge-top");
  const bl    = document.getElementById("badge-label");
  if(m==="matin") {
    bm.className="mode-btn active-matin"; bs.className="mode-btn";
    badge.className="badge-pill badge-matin"; bl.textContent="Wellness matin";
    document.getElementById("select-title").textContent="Bonjour 👋";
    document.getElementById("select-sub").textContent="Qui es-tu ?";
  } else {
    bs.className="mode-btn active-seance"; bm.className="mode-btn";
    badge.className="badge-pill badge-seance"; bl.textContent="RPE post-séance";
    document.getElementById("select-title").textContent="Après la séance 🔥";
    document.getElementById("select-sub").textContent="Comment c'était ?";
  }
  buildGrid();
}

// ── Open form
function openForm(player) {
  currentPlayer = player;
  wVals = {}; ITEMS_W.forEach(it=>wVals[it.key]=0);
  rpeVal = null; dureeVal = 75;

  document.getElementById("form-avatar").textContent = initials(player);
  document.getElementById("form-name").textContent = player;
  document.getElementById("form-date").textContent = DATE_STR + " · " + (mode==="matin"?"Matin":"Post-séance");

  const btn = document.getElementById("submit-btn");
  btn.className = "submit-btn " + (mode==="matin"?"submit-btn-matin":"submit-btn-seance");
  btn.disabled = true;

  buildFormBody();
  show("screen-form");
}

// ── Build form body
function buildFormBody() {
  const body = document.getElementById("form-body");
  if(mode==="matin") {
    body.innerHTML = `
      <div class="section-sep">Score total</div>
      <div class="score-wrap">
        <div class="score-row">
          <span class="score-label">Wellness</span>
          <div class="score-track"><div class="score-fill" id="sf" style="width:0%"></div></div>
          <span class="score-num" id="sn" style="color:var(--muted)">—/30</span>
        </div>
      </div>
      <div class="section-sep">Comment tu te sens ce matin ? (1 mauvais · 5 excellent)</div>
      <div class="item-list" id="item-list"></div>
      <div class="section-sep">Note pour le staff</div>
      <div class="note-wrap">
        <div class="note-hint">Douleur, blessure, ressenti…</div>
        <textarea id="note" rows="2" placeholder="Optionnel"></textarea>
      </div>`;
    buildItems();
  } else {
    body.innerHTML = `
      <div class="section-sep">Durée de la séance</div>
      <div class="slider-wrap">
        <div class="slider-label">Durée</div>
        <div class="slider-row">
          <input type="range" min="20" max="150" value="75" step="5" id="dur-slider" oninput="onDuree(this.value)">
          <span class="slider-val" id="dur-val">75 min</span>
        </div>
      </div>
      <div class="section-sep">Effort perçu — RPE (0 à 9)</div>
      <div class="rpe-wrap">
        <div class="rpe-card">
          <div class="rpe-big" id="rpe-big">—</div>
          <div class="rpe-desc" id="rpe-desc">Sélectionne ton niveau d'effort</div>
          <div class="rpe-row">${[0,1,2,3,4].map(v=>`<button class="rpe-btn" data-v="${v}" onclick="setRpe(${v})">${v}</button>`).join("")}</div>
          <div class="rpe-row">${[5,6,7,8,9].map(v=>`<button class="rpe-btn" data-v="${v}" onclick="setRpe(${v})">${v}</button>`).join("")}</div>
        </div>
      </div>
      <div class="section-sep">Charge de séance (sRPE)</div>
      <div class="srpe-display">
        <span class="srpe-label">RPE × Durée</span>
        <span class="srpe-val" id="srpe-v">— UA</span>
      </div>
      <div class="section-sep">Note pour le staff</div>
      <div class="note-wrap">
        <div class="note-hint">Ressenti, blessure, commentaire…</div>
        <textarea id="note" rows="2" placeholder="Optionnel"></textarea>
      </div>`;
  }
}

function buildItems() {
  const list = document.getElementById("item-list");
  ITEMS_W.forEach(it => {
    const div = document.createElement("div");
    div.className = "item-card"; div.id = "card-"+it.key;
    div.innerHTML = `
      <div class="item-top">
        <span class="item-emoji">${it.emoji}</span>
        <span class="item-name">${it.label}</span>
        <span class="item-val" id="iv-${it.key}">—</span>
      </div>
      <div class="btns">
        ${[1,2,3,4,5].map(v=>`<button class="w-btn" data-k="${it.key}" data-v="${v}" onclick="setW('${it.key}',${v})" aria-label="${it.label} ${v}">${v}</button>`).join("")}
      </div>`;
    list.appendChild(div);
  });
}

function setW(key, v) {
  wVals[key] = v;
  document.querySelectorAll(`[data-k="${key}"]`).forEach(b=>{
    const bv=parseInt(b.dataset.v);
    b.className="w-btn"+(bv<=v?" sel-"+v:"");
  });
  const iv = document.getElementById("iv-"+key);
  iv.textContent = v;
  iv.style.color = v>=4?"var(--green)":v===3?"var(--amber)":"var(--red)";
  document.getElementById("card-"+key).classList.toggle("filled", true);
  updateScore();
}

function updateScore() {
  const total = Object.values(wVals).reduce((a,b)=>a+b,0);
  const done  = Object.values(wVals).filter(v=>v>0).length;
  const pct   = (total/30)*100;
  const sf = document.getElementById("sf");
  const sn = document.getElementById("sn");
  if(sf) {
    sf.style.width = pct+"%";
    sf.style.background = total>=24?"var(--green)":total>=18?"var(--amber)":"var(--red)";
    sn.textContent = done===6?total+"/30":"—/30";
    sn.style.color = done===6?(total>=24?"var(--green)":total>=18?"var(--amber)":"var(--red)"):"var(--muted)";
  }
  document.getElementById("submit-btn").disabled = done < 6;
}

function setRpe(v) {
  rpeVal = v;
  const big = document.getElementById("rpe-big");
  big.textContent = v;
  big.className = "rpe-big pop";
  setTimeout(()=>big.classList.remove("pop"), 150);
  big.style.color = v<=4?"var(--green)":v<=7?"var(--amber)":"var(--red)";
  document.getElementById("rpe-desc").textContent = RPE_DESC[v];
  document.querySelectorAll(".rpe-btn").forEach(b=>{
    const bv=parseInt(b.dataset.v);
    b.className="rpe-btn"+(bv===v?" rsel "+(v<=4?"low":v<=7?"mid":"high"):"");
  });
  updateSrpe();
  document.getElementById("submit-btn").disabled = false;
}

function onDuree(v) {
  dureeVal = parseInt(v);
  document.getElementById("dur-val").textContent = v+" min";
  updateSrpe();
}

function updateSrpe() {
  if(rpeVal===null) return;
  const s = rpeVal*dureeVal;
  const el = document.getElementById("srpe-v");
  el.textContent = s+" UA";
  el.style.color = s<300?"#60A5FA":s<=600?"var(--green)":s<=800?"var(--amber)":"var(--red)";
}

// ── Submit
async function handleSubmit() {
  const btn = document.getElementById("submit-btn");
  btn.disabled = true;
  btn.textContent = "Envoi…";
  const note = document.getElementById("note")?.value||"";

  let payload = {
    joueur: currentPlayer,
    date: DATE_STR,
    mode: mode,
    note: note,
    timestamp: new Date().toISOString()
  };

  let statsHTML = "";

  if(mode==="matin") {
    const total = Object.values(wVals).reduce((a,b)=>a+b,0);
    const status = total>=24?"Bon":total>=18?"Attention":total>=12?"Vigilance":"Alerte";
    const weak = ITEMS_W.reduce((a,b)=>wVals[a.key]<=wVals[b.key]?a:b).label;
    ITEMS_W.forEach(it=>payload[it.key]=wVals[it.key]);
    payload.score_total = total;
    payload.statut = status;
    payload.point_faible = weak;

    const sc = total>=24?"var(--green)":total>=18?"var(--amber)":total>=12?"#F97316":"var(--red)";
    statsHTML = `
      <div class="stat"><div class="stat-val" style="color:${sc}">${total}</div><div class="stat-lbl">Score /30</div></div>
      <div class="stat"><div class="stat-val" style="font-size:14px;color:${sc}">${status}</div><div class="stat-lbl">Statut</div></div>
      <div class="stat"><div class="stat-val" style="font-size:13px;color:var(--muted)">${weak}</div><div class="stat-lbl">Point faible</div></div>`;
  } else {
    const srpe = rpeVal*dureeVal;
    payload.rpe = rpeVal;
    payload.duree = dureeVal;
    payload.srpe = srpe;
    const sc = srpe<300?"#60A5FA":srpe<=600?"var(--green)":srpe<=800?"var(--amber)":"var(--red)";
    statsHTML = `
      <div class="stat"><div class="stat-val" style="color:${rpeVal<=4?"var(--green)":rpeVal<=7?"var(--amber)":"var(--red)"}">${rpeVal}</div><div class="stat-lbl">RPE /9</div></div>
      <div class="stat"><div class="stat-val">${dureeVal}</div><div class="stat-lbl">Durée (min)</div></div>
      <div class="stat"><div class="stat-val" style="color:${sc}">${srpe}</div><div class="stat-lbl">sRPE (UA)</div></div>`;
  }

  // Envoyer au Google Apps Script
  try {
    await fetch(APPS_SCRIPT_URL, {
      method:"POST",
      mode:"no-cors",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    });
  } catch(e) { console.log("Hors ligne — données sauvegardées localement"); }

  // Sauvegarder localement aussi
  localStorage.setItem("done_"+mode+"_"+currentPlayer+"_"+NOW.toDateString(), "1");
  const history = JSON.parse(localStorage.getItem("history")||"[]");
  history.push(payload);
  localStorage.setItem("history", JSON.stringify(history));

  // Écran succès
  const ok = document.getElementById("screen-success");
  ok.className = "success-screen active success-"+(mode==="matin"?"matin":"seance");
  document.getElementById("ok-icon").textContent = mode==="matin"?"🌅":"🔥";
  document.getElementById("ok-title").textContent = mode==="matin"?"Wellness envoyé !":"RPE envoyé !";
  document.getElementById("ok-sub").textContent = currentPlayer+" · "+DATE_STR;
  document.getElementById("ok-stats").innerHTML = statsHTML;
  show("screen-success");
}

function goBack() { show("screen-select"); buildGrid(); }
function goHome()  { show("screen-select"); buildGrid(); }

function show(id) {
  document.querySelectorAll(".screen, .success-screen").forEach(s=>{
    s.classList.remove("active");
  });
  document.getElementById(id).classList.add("active");
}

// Init
buildGrid();
</script>
</body>
</html>
